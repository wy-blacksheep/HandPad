        function isStickerOverTrash(id) {
            if (id && draggingId) {
                // Check if something is being dragged
                let sticker = activeStickers[id];
                
                // Check if the mouse is within the bounds of the trash icon
                let withinXBounds = mouseX >= trashIconX && mouseX <= (trashIconX + trashIconWidth);
                let withinYBounds = mouseY >= trashIconY && mouseY <= (trashIconY + trashIconHeight);
                
                if (withinXBounds && withinYBounds) {
                    return true;
                }
            }
            return false;
        }

        function mousePressed() {
            if(mouseX <= 0 || mouseY <= 0) return

            let clickedStickers = [];
            
            for (const [id, sticker] of Object.entries(activeStickers)) {
                let img = stickerImages[id];
                
                if (img) {
                    if (id.includes("_TXT_")) {
                        let bounding_box = font.textBounds(sticker.adjustedValue, sticker.x, sticker.y, sticker.size);
                        bounding_box.h = sticker.adjustedHeight;
                        idW = bounding_box.w;
                        idH = bounding_box.h;
                        idX = bounding_box.x;
                        idY = bounding_box.y;
                    }
                    else if (id.includes("_IMG_")) {
                        idX = sticker.x;
                        idY = sticker.y;
                        idW = sticker.width;
                        idH = sticker.height;
                    }
                    // Translate mouse coordinates to object's local coordinate system
                    let localMouseX = mouseX - idX;
                    let localMouseY = mouseY - idY;
                    
                    // Rotate mouse coordinates in opposite direction of object rotation to align them
                    let rotatedMouseX = cos(-sticker.rotation) * localMouseX - sin(-sticker.rotation) * localMouseY;
                    let rotatedMouseY = sin(-sticker.rotation) * localMouseX + cos(-sticker.rotation) * localMouseY;
                    
                    // Perform hit test in object's local coordinate system
                    if (rotatedMouseX >= 0 && rotatedMouseX <= idW &&
                        rotatedMouseY >= 0 && rotatedMouseY <= idH) {
                        clickedStickers.push({ id: id, zIndex: sticker.zIndex });
                        
                        
                        
                        // Store offsets for smooth dragging
                        sticker.dx = rotatedMouseX;
                        if (id.includes("_TXT_")) sticker.dy = rotatedMouseY - textSize() / 2;
                        else sticker.dy = rotatedMouseY;
                    }
                    
                }
            }
            
            if (clickedStickers.length > 0) {

                draggingId = clickedStickers[0].id;

                isDrawing = true;
                if(mouseX > 0 && mouseY > 0){
                    currentStroke = [{ x: mouseX, y: mouseY }];
                }
            }

        function rotateImage(id, delta) {
            let sticker = activeStickers[id];

            if (id.includes("_TXT_")) {
                delta *= 2;
            }

            let angleDelta = radians(delta * 1);

            // Translate mouse coordinates to object's local coordinate system
            let localMouseX = mouseX - sticker.x;
            let localMouseY = mouseY - sticker.y;

            // Rotate mouse coordinates in opposite direction of object rotation to align them
            let rotatedMouseX = cos(-sticker.rotation) * localMouseX - sin(-sticker.rotation) * localMouseY;
            let rotatedMouseY = sin(-sticker.rotation) * localMouseX + cos(-sticker.rotation) * localMouseY;

            // Calculate new rotated coordinates for the mouse position
            let newRotatedMouseX = cos(angleDelta) * rotatedMouseX - sin(angleDelta) * rotatedMouseY;
            let newRotatedMouseY = sin(angleDelta) * rotatedMouseX + cos(angleDelta) * rotatedMouseY;

            // Convert the new rotated coordinates back to the global coordinate system
            let newGlobalMouseX = cos(sticker.rotation) * newRotatedMouseX - sin(sticker.rotation) * newRotatedMouseY + sticker.x;
            let newGlobalMouseY = sin(sticker.rotation) * newRotatedMouseX + cos(sticker.rotation) * newRotatedMouseY + sticker.y;

            // Update sticker position
            sticker.x += mouseX - newGlobalMouseX;
            sticker.y += mouseY - newGlobalMouseY;

            // Update the rotation
            sticker.rotation += angleDelta;
        }


        function scaleImage(id, delta) {
            if (id.includes("_TXT_")) {
                // Scale text
                //delta *= 2;

                let sticker = activeStickers[id];
                let scaleFactor = 1 - (delta * 0.001);
                sticker.size *= scaleFactor;
                //sticker.size += delta;             
            } else {
                let sticker = activeStickers[id];
                let scaleFactor = 1 - (delta * 0.001);

                // Translate mouse coordinates to object's local coordinate system
                let localMouseX = mouseX - sticker.x;
                let localMouseY = mouseY - sticker.y;

                // Rotate mouse coordinates in opposite direction of object rotation to align them
                let rotatedMouseX = cos(-sticker.rotation) * localMouseX - sin(-sticker.rotation) * localMouseY;
                let rotatedMouseY = sin(-sticker.rotation) * localMouseX + cos(-sticker.rotation) * localMouseY;

                // Calculate new scaled coordinates for the mouse position
                let newScaledMouseX = rotatedMouseX * scaleFactor;
                let newScaledMouseY = rotatedMouseY * scaleFactor;

                // Convert the new scaled coordinates back to the global coordinate system
                let newGlobalMouseX = cos(sticker.rotation) * newScaledMouseX - sin(sticker.rotation) * newScaledMouseY + sticker.x;
                let newGlobalMouseY = sin(sticker.rotation) * newScaledMouseX + cos(sticker.rotation) * newScaledMouseY + sticker.y;

                // Update sticker position
                sticker.x += mouseX - newGlobalMouseX;
                sticker.y += mouseY - newGlobalMouseY;

                // Update the dimensions
                sticker.width *= scaleFactor;
                sticker.height *= scaleFactor;

                
            }
        }

        function drawDashedLine(x1, y1, x2, y2, dashLength) {
            const distance = dist(x1, y1, x2, y2);
            const numDashes = floor(distance / dashLength);
            for (let i = 0; i < numDashes; i++) {
                const xStart = lerp(x1, x2, i / numDashes);
                const yStart = lerp(y1, y2, i / numDashes);
                const xEnd = lerp(x1, x2, (i + 0.5) / numDashes);
                const yEnd = lerp(y1, y2, (i + 0.5) / numDashes);
                line(xStart, yStart, xEnd, yEnd);
            }
        }

        async function loadCanvasData() {
            try {
                const response = await fetch("/api/tutorial_data");
                if (response.ok) {
                    canvasData = await response.json();
                    for (const item of canvasData) {
                        if (item.Type === "CanvasProps") {
                            canvasProps = item;
                            break;
                        }
                    }
                } else {
                    console.error("Failed to fetch canvas data");
                }
            } catch (error) {
                console.error(error);
            }
        }

        let strokes = [];

        let imageCache = {}; // to cache loaded images

        function drawItems() {

            for (const item of canvasData) {
                if (item.Type === "Rectangle") {
                    const x = item.x * width;
                    const y = item.y * height;
                    const cx = x + item.width / 2;
                    const cy = y + item.height / 2;
                    stroke(item.strokeColor || "#000");
                    strokeWeight(4);
                    noFill();
                    push();
                    translate(cx, cy);
                    rotate(item.rotation);

                    // Draw dashed lines for the rectangle
                    drawDashedLine(-item.width / 2, -item.height / 2, item.width / 2, -item.height / 2, 20);
                    drawDashedLine(item.width / 2, -item.height / 2, item.width / 2, item.height / 2, 20);
                    drawDashedLine(item.width / 2, item.height / 2, -item.width / 2, item.height / 2, 20);
                    drawDashedLine(-item.width / 2, item.height / 2, -item.width / 2, -item.height / 2, 20);

                    pop();
                } else if (item.Type === "Image") {
                    const x = item.x * width;
                    const y = item.y * height;
                    let img = imageCache[item.ImageSRC];
                    if (img) {
                        image(img, x, y, item.width, item.height);
                    }
                    else {
                        loadImage(item.ImageSRC, (loadedImg) => {
                            imageCache[item.ImageSRC] = loadedImg; // store the loaded image in the cache
                            image(loadedImg, x, y, item.width, item.height); // draw the loaded image
                        });
                    }
                } else if (item.Type === "Text") {
                    const x = item.x * width;
                    const y = item.y * height;
                    noStroke();
                    fill(item.textColor || "#000"); // Use given text color or default to black
                    textSize(item.size);
                    
                    if(item.boundWidth && item.boundWidth) {
                        const boundW = item.boundWidth * width; // Assuming boundWidth is relative to canvas width
                        const words = item.value.split(' ');
                        let line = '';
                        let yOffset = 0;
                        for(const word of words) {
                            const testLine = line + word + ' ';
                            const testWidth = textWidth(testLine);
                            if(testWidth > boundW && line.length > 0) {
                                text(line, x, y + yOffset);
                                line = word + ' ';
                                yOffset += textSize(); // or another value depending on desired line spacing
                            } else {
                                line = testLine;
                            }
                        }
                        text(line, x, y + yOffset); // Draw the last line
                    } else {
                        text(item.value, x, y);
                    }
                } else if (item.Type === "CanvasProps") {
                    // Draw the signing rectangle
                    const signX = item.signX * width;
                    const signY = item.signY * height;
                    const cx = signX + item.signWidth / 2;
                    const cy = signY + item.signHeight / 2;
                    stroke(item.signColor || '#000');
                    strokeWeight(item.signThickness || 4);
                    fill(item.signBG || 'rgba(255, 255, 255, 0.5)');
                    push();
                    translate(cx, cy);
                    rotate(item.signRotation || 0);
                    rect(-item.signWidth / 2, -item.signHeight / 2, item.signWidth, item.signHeight);
                    pop();

                    
                    stroke(0);
                    strokeWeight(4);
                    noFill();
                    for (const stroke of strokes) {
                        beginShape();
                        for (const point of stroke) {
                            vertex(point.x, point.y);
                        }
                        endShape();
                    }
                
                    // Also draw the currentStroke
                    

                    if(isDrawing && currentStroke.length > 0) {
                        beginShape();
                        for(const point of currentStroke) {
                            vertex(point.x, point.y);
                        }
                        endShape();
                    }
                }
            }
        }


        function isWithinSigningBounds() {
            const signX = canvasProps.signX * width;
            const signY = canvasProps.signY * height;
            const signWidth = canvasProps.signWidth;
            const signHeight = canvasProps.signHeight;

            return mouseX >= signX && mouseX <= (signX + signWidth) &&
                mouseY >= signY && mouseY <= (signY + signHeight);
        }

                loadImage(imgURL, (img) => {
                    imgWidth = 200;
                    imgHeight = img.height * (imgWidth / img.width);
                    const imageObject = {
                        Type: "Image",
                        ImageSRC: imgURL,
                        img: img,
                        x: mouseX,
                        y: mouseY,
                        zIndex: maxZIndex,
                        width: imgWidth,
                        height: imgHeight,
                        rotation: 0,
                        scale: 1
                    };
                    activeStickers[id] = imageObject;
                    stickerImages[id] = img;
                });
            } else {
                id = activeStickerCount + "_TXT_" + str;
                const textObject = {
                    Type: "Text",
                    value: str,
                    x: mouseX,
                    y: mouseY,

                    boundWidth: '1',
                    rotation: 0,
                    scale: 1
                };
                activeStickers[id] = textObject;
                stickerImages[id] = str;
            }
        }
